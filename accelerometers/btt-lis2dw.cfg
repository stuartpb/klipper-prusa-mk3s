# WARNING. DO NOT EDIT THIS FILE.
# To override settings from this file, you can copy and paste the relevant
# sections into your printer.cfg and change it there.

# Based on https://github.com/bigtreetech/LIS2DW/blob/master/Firmware/sample-bigtreetech-lis2dw-v1.0.cfg
# with comments/changes based on https://github.com/charminULTRA/Klipper-Input-Shaping-MK3S-Upgrade/blob/main/1%20-%20Primary%20Configuration%20Files/adxlmcu-BTT.cfg

# Config file for using the BIGTREETECH (BTT) LIS2DW USB board on Prusa MK3S+
#
# You will first need to build and flash the firmware onto the BTT board.
# Follow the instructions in the user manual here: https://github.com/bigtreetech/LIS2DW
#
# IMPORTANT: After flashing, find your board's unique serial path by running:
#   ls /dev/serial/by-id/*
# Then replace the placeholder serial below with your board's actual path.
#
# IMPORTANT: The axes_map value depends on how the accelerometer is mounted.
# You will need to swap the axes_map when moving the accelerometer between
# the toolhead (X-axis calibration) and the bed (Y-axis calibration).
#
# After running SHAPER_CALIBRATE for each axis, remember to SAVE_CONFIG
# or manually add both X and Y results to your printer.cfg [input_shaper] section.

[mcu btt_lis2dw]
serial: /dev/serial/by-id/usb-Klipper_rp2040_btt_acc-if00

[lis2dw]
cs_pin: btt_lis2dw:gpio9
#spi_bus: spi1a
spi_software_sclk_pin: btt_lis2dw:gpio10
spi_software_mosi_pin: btt_lis2dw:gpio11
spi_software_miso_pin: btt_lis2dw:gpio8
# Axes map for toolhead mount (X-axis calibration):
axes_map: z, x, y
# Axes map for bed mount (Y-axis calibration):
#axes_map: -y, -x, z

[resonance_tester]
accel_chip: lis2dw
# Probe point at center of MK3S/+ bed (210x210mm)
probe_points:
   105,105,20

# More info: https://www.klipper3d.org/Config_Reference.html#lis2dw
