[include klipper-prusa-mk3s/macros.cfg]

### INPUT SHAPING

# Uncomment ONE of the lines below, depending on which accelerometer board you are using.
#[include accelerometers/btt-adxl345.cfg] # ONLY FOR USE DURING INPUT SHAPING TESTING - Leaving this on without the accelerometer plugged in will cause Klipper to not work.
#[include accelerometers/btt-lis2dw.cfg] # ONLY FOR USE DURING INPUT SHAPING TESTING - Leaving this on without the accelerometer plugged in will cause Klipper to not work.
#[include accelerometers/kusba.cfg] # ONLY FOR USE DURING INPUT SHAPING TESTING - Leaving this on without the accelerometer plugged in will cause Klipper to not work.

[input_shaper]

### AXIS TWIST COMPENSATION
# Corrects for X-axis twist affecting probe accuracy.
# Common on MK3S/+ due to the PINDA offset from nozzle. Run this BEFORE bed mesh.

[axis_twist_compensation]
calibrate_start_x: 24
calibrate_end_x: 228
calibrate_y: 105

### OTHER FEATURES OR TUNING
[exclude_object]

### SKEW CORRECTION - This is the LAST tuning procedure. Follow instructions.
##TUNE ME
[skew_correction]

### FIRMWARE RETRACTION
## Enables G10/G11 retraction commands handled by Klipper instead of slicer.
## Allows runtime tuning with SET_RETRACTION without reslicing.
## Values below are based on the MK3.5 direct drive extruder.
[firmware_retraction]
retract_length: 0.8
retract_speed: 35
unretract_extra_length: 0
unretract_speed: 35

### HEATER VERIFICATION
## Prevents false "heater not heating" shutdowns. Extruder uses Klipper defaults.
## Bed uses relaxed values because the MK52 heats slowly, especially to 90-100C.
[verify_heater extruder]
max_error: 120
check_gain_time: 20
hysteresis: 5
heating_gain: 2

[verify_heater heater_bed]
max_error: 200
check_gain_time: 60
hysteresis: 5
heating_gain: 1

### IDLE TIMEOUT
## Turns off heaters and disables steppers after 30 minutes of inactivity.
## Default is 10 minutes which can be too short for filament swaps or setup.
[idle_timeout]
timeout: 1800
gcode:
    TURN_OFF_HEATERS
    M84
    M117 Idle timeout

### PERSISTENT VARIABLES
## Required for Spoolman integration and any macros that save state across restarts.
[save_variables]
filename: ~/printer_data/config/saved_variables.cfg

### THIRD PARTY FEATURES

### MISC
[menu __main __octoprint]
type: disabled #Removes Octoprint from physical printer menu. Not needed.

[safe_z_home]
home_xy_position: 11,6
speed: 50.0
z_hop: 15
z_hop_speed: 15.0
move_to_previous: False

