[extruder]
##TUNE ME
##Extruder Rotation Distance - Prior to calibration, make sure your Idler Screw Tension is correct: https://help.prusa3d.com/article/idler-screw-tension_177367
# rotation_distance: 22.95981632 #Make sure you tune this for your individual machine: https://ellis3dp.com/Print-Tuning-Guide/articles/extruder_calibration.html

##TUNE ME
# PID_CALIBRATE HEATER=extruder TARGET=170
# SAVE_CONFIG
##Items below come from performing PID Tuning, yours will be unique!!
control = pid
pid_kp = 29.944
pid_ki = 2.037
pid_kd = 110.045

##TUNE ME
##Pressure Advance Section - Perform this tuning for your individual machine: https://ellis3dp.com/Print-Tuning-Guide/articles/index_pressure_advance.html
##ENTER THE PA VALUE IN SLICER FILAMENT SETTINGS - In Filament Settings Custom G Code section (allows you to print with different PA for each filament, more flexible than here).
##You may also enter a set a global value here if you want, but it's not recommended.
#pressure_advance: 0.05

nozzle_diameter: 0.4 # Remember to change this if you change nozzle diameter.

[heater_bed]
##TUNE ME
# PID_CALIBRATE HEATER=heater_bed TARGET=60
# SAVE_CONFIG
##Items below come from performing PID Tuning, yours will be unique!!
control = pid
pid_kp = 48.658
pid_ki = 0.603
pid_kd = 981.685

